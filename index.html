<!DOCTYPE html>
<html>
<head>
    <style>
        body { font: 24px sans-serif; text-align: center; margin-top: 20vh; background: #eee; overflow: hidden; }
        .p { position: absolute; width: 200px; padding: 15px; background: white; border: 2px solid #000; box-shadow: 4px 4px 10px rgba(0,0,0,0.2); }
        .p a { color: blue; text-decoration: none; font-weight: bold; } /* Gjør lenken synlig */
        .p a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Gerd was here</h1>

    <script>
        const N = 20; // Antall pop-ups
        const LENKE = "https://google.com"; // KONFIGURASJON: Lim inn din lenke her

        for (let i = 0; i < N; i++) {
            const div = document.createElement('div');
            div.className = 'p';
            div.style.left = Math.random() * (window.innerWidth - 240) + 'px';
            div.style.top = Math.random() * (window.innerHeight - 100) + 'px';
            
            // Lenken er satt inn her:
            div.innerHTML = `<a href="${LENKE}" target="_blank">Gerd was here</a> <b style="color:red;float:right;cursor:pointer" onclick="this.parentNode.remove()">X</b>`;
            
            document.body.appendChild(div);
        }
    </script>

</body>
</html>
